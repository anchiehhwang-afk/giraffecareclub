<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Giraffe Care Club・夜間儀式</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap');

:root{
  --bg-deep:#1D0F17;
  --bg-deep2:#241019;
  --bg-panel:#33182A;
  --bg-panel-2:#3F1F30;
  --gold:#C9A24C;
  --gold-soft:#E7CB8E;
  --gold-dim:#8C743A;
  --ivory:#F3E9DD;
  --rose:#D98A93;
  --muted:#B79D89;
  --danger:#C06A5F;
  --success:#8FAE86;
  --radius-lg:22px;
  --radius-md:14px;
  --radius-sm:9px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  min-height:100vh;
  background:
    radial-gradient(ellipse 700px 500px at 50% -10%, rgba(201,162,76,0.16), transparent 60%),
    radial-gradient(ellipse 900px 700px at 50% 110%, rgba(217,138,147,0.10), transparent 60%),
    linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-deep2) 100%);
  color:var(--ivory);
  font-family:'Noto Sans TC', sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:0 0 40px 0;
}
.serif{font-family:'Noto Serif TC', serif;}
.num{font-family:'Cormorant Garamond', serif;}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding:22px 18px 10px;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ---------- generic ---------- */
.eyebrow{
  font-family:'Cormorant Garamond', serif;
  letter-spacing:0.32em;
  font-size:11px;
  color:var(--gold-soft);
  text-transform:uppercase;
  text-align:center;
  opacity:0.85;
}
.h1{font-family:'Noto Serif TC',serif;font-weight:700;font-size:22px;text-align:center;color:var(--ivory);margin:6px 0 2px;}
.sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:18px;line-height:1.6;}
.card-panel{
  background:linear-gradient(160deg, var(--bg-panel), var(--bg-panel-2));
  border:1px solid rgba(201,162,76,0.28);
  border-radius:var(--radius-lg);
  padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.35);
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid rgba(201,162,76,0.5);
  background:rgba(201,162,76,0.08);
  color:var(--gold-soft);
  border-radius:999px;
  padding:12px 18px;
  font-size:14px;
  font-weight:600;
  transition:all .2s ease;
  width:100%;
}
.btn:active{transform:scale(0.97);}
.btn-solid{
  background:linear-gradient(135deg, var(--gold), #A9803B);
  color:#2A1408;
  border:none;
  box-shadow:0 6px 18px rgba(201,162,76,0.28);
}
.btn-ghost{background:transparent;border:1px solid rgba(243,233,221,0.25);color:var(--muted);}
.btn-icon{width:16px;height:16px;vertical-align:-3px;margin-right:6px;object-fit:contain;}
.icon-symbol{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:20px;line-height:1;vertical-align:-4px;margin-right:6px;display:inline-block;}
.btn-danger{border-color:rgba(192,106,95,0.6);color:var(--danger);background:rgba(192,106,95,0.08);}
.btn-sm{width:auto;padding:8px 14px;font-size:12.5px;}
.row{display:flex;gap:10px;}
.col{flex:1;}
.mt8{margin-top:8px;}.mt12{margin-top:12px;}.mt16{margin-top:16px;}.mt20{margin-top:20px;}.mt24{margin-top:24px;}
.label{font-size:12px;color:var(--muted);margin-bottom:6px;display:block;}
.input{
  width:100%;background:rgba(0,0,0,0.22);border:1px solid rgba(243,233,221,0.18);
  border-radius:var(--radius-sm);padding:11px 12px;color:var(--ivory);font-size:14px;
}
.input:focus{outline:none;border-color:var(--gold);}
select.input{background:#F4C542;color:#241019;border-color:#B8901F;font-weight:600;}
select.input option{background:#F4C542;color:#241019;}
.chip{
  border:1px solid rgba(243,233,221,0.22);background:rgba(0,0,0,0.18);color:var(--muted);
  border-radius:999px;padding:9px 14px;font-size:13px;text-align:center;transition:all .2s;
}
.chip.active{background:rgba(201,162,76,0.18);border-color:var(--gold);color:var(--gold-soft);font-weight:600;}
.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(201,162,76,0.35),transparent);margin:18px 0;}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:0.02em;}
.badge-pending{background:rgba(201,162,76,0.18);color:var(--gold-soft);}
.badge-confirmed{background:rgba(143,174,134,0.18);color:var(--success);}
.badge-completed{background:rgba(243,233,221,0.1);color:var(--muted);}
.badge-declined{background:rgba(192,106,95,0.18);color:var(--danger);}
.cal-wrap{margin-top:12px;}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cal-nav{background:transparent;border:1px solid rgba(243,233,221,0.2);color:var(--gold-soft);font-size:16px;cursor:pointer;padding:4px 14px;border-radius:8px;}
.cal-title{font-size:14px;font-weight:600;color:var(--ivory);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-weekday{text-align:center;font-size:10.5px;color:var(--muted);padding:4px 0;}
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:9px;font-size:12.5px;color:var(--ivory);cursor:pointer;background:rgba(255,255,255,0.03);gap:2px;}
.cal-day.empty{visibility:hidden;cursor:default;}
.cal-day.today{border:1px solid var(--gold-soft);}
.cal-day.selected{background:rgba(201,162,76,0.28);}
.cal-dot{width:5px;height:5px;border-radius:50%;}
.cal-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:10.5px;color:var(--muted);}
.cal-legend .cal-dot{display:inline-block;margin-right:4px;vertical-align:1px;}
.hidden{display:none !important;}
.center{text-align:center;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.iconbtn{background:none;border:none;color:var(--muted);font-size:13px;padding:6px 8px;border-radius:8px;}
.iconbtn:active{background:rgba(255,255,255,0.06);}
.tabs{display:flex;gap:8px;margin:18px 0 16px;position:sticky;top:0;z-index:20;padding:10px 0 8px;background:linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-deep2) 70%, transparent 100%);}
.tab{flex:1;text-align:center;padding:10px 4px;border-radius:12px;font-size:13px;color:var(--muted);border:1px solid transparent;}
.tab.active{background:rgba(201,162,76,0.12);border-color:rgba(201,162,76,0.4);color:var(--gold-soft);font-weight:700;}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:30px 10px;line-height:1.8;}
.list-item{background:rgba(0,0,0,0.18);border:1px solid rgba(243,233,221,0.1);border-radius:var(--radius-md);padding:14px;margin-bottom:10px;}

/* ---------- onboarding / pin ---------- */
.flame{font-size:34px;text-align:center;margin-bottom:6px;filter:drop-shadow(0 0 10px rgba(201,162,76,0.5));}
.brand-logo{display:flex;align-items:flex-end;justify-content:center;gap:1px;margin-bottom:6px;}
.brand-logo.sm{margin-bottom:2px;}
.brand-word{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;color:var(--gold-soft);letter-spacing:0.01em;}
.brand-logo .brand-word{font-size:22px;}
.brand-logo.sm .brand-word{font-size:17px;}
.brand-giraffe-icon{width:15px;height:23px;color:var(--gold-soft);position:relative;top:2px;flex-shrink:0;}
.brand-logo.sm .brand-giraffe-icon{width:11px;height:17px;top:1px;}
.brand-tagline{text-align:center;font-size:10px;letter-spacing:0.22em;color:var(--muted);text-transform:uppercase;margin-bottom:14px;}
.dots{display:flex;justify-content:center;gap:14px;margin:22px 0;}
.dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--gold-dim);transition:all .2s;}
.dot.filled{background:var(--gold);border-color:var(--gold);box-shadow:0 0 10px rgba(201,162,76,0.7);}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:280px;margin:0 auto;}
.key{
  aspect-ratio:1;border-radius:50%;border:1px solid rgba(201,162,76,0.3);background:rgba(255,255,255,0.03);
  color:var(--ivory);font-size:19px;font-family:'Cormorant Garamond',serif;font-weight:600;
}
.key:active{background:rgba(201,162,76,0.18);}
.key.wide{font-size:12px;color:var(--muted);}

/* ---------- role select ---------- */
.role-grid{display:flex;flex-direction:row;gap:12px;margin-top:24px;}
.role-card{
  background:linear-gradient(160deg, var(--bg-panel), var(--bg-panel-2));
  border:1px solid rgba(201,162,76,0.25);border-radius:var(--radius-lg);
  padding:16px 10px 18px;text-align:center;transition:all .2s;flex:1;min-width:0;
}
.role-card:active{transform:scale(0.98);border-color:var(--gold);}
.role-avatar{
  width:86px;height:86px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 12px;
  border:2px solid var(--gold);box-shadow:0 8px 20px rgba(0,0,0,0.4), 0 0 0 4px rgba(201,162,76,0.12);
}
.role-card .tt{font-family:'Noto Serif TC',serif;font-weight:700;font-size:15.5px;color:var(--gold-soft);line-height:1.4;}
.role-card .dd{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.6;}

/* ---------- membership card ---------- */
.mcard-wrap{position:relative;border-radius:20px;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,0.45);}
.mcard-img{width:100%;display:block;}
.mcard-overlay{
  position:absolute;left:32%;top:80%;width:64%;
  display:flex;align-items:baseline;justify-content:flex-end;white-space:nowrap;
  font-family:'Cormorant Garamond',serif;color:#8a5a3f;
}
.mcard-overlay .row1{font-size:10.5px;font-weight:600;color:#6b4530;opacity:0.85;margin-right:3ch;}
.mcard-overlay .row2{font-size:15px;font-weight:700;color:#c97b83;}
.mcard-overlay .row2 .num{font-size:25px;font-weight:700;}

.quota-row{display:flex;gap:10px;margin-top:16px;}
.quota-wrap{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
.quota-wrap .quota-pill{flex:1 1 28%;}
.quota-pill{
  flex:1;background:rgba(0,0,0,0.2);border:1px solid rgba(243,233,221,0.12);
  border-radius:var(--radius-md);padding:12px 10px;text-align:center;
}
.quota-pill .n{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--gold-soft);font-weight:700;}
.quota-pill .l{font-size:10.5px;color:var(--muted);margin-top:2px;}
.quota-empty{margin-top:56px;}

/* purchase plan cards */
.plan{
  border:1px solid rgba(243,233,221,0.14);border-radius:var(--radius-md);
  padding:15px 16px;margin-bottom:12px;background:rgba(0,0,0,0.15);
}
.plan-top{display:flex;justify-content:space-between;align-items:center;}
.plan-title{font-weight:700;font-size:14.5px;color:var(--ivory);}
.plan-price{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--gold-soft);font-weight:700;}
.plan-desc{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.6;}
.plan-image{width:100%;border-radius:var(--radius-sm);margin-top:10px;display:block;object-fit:cover;max-height:180px;}

/* toast */
#toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:linear-gradient(135deg,var(--gold),#A9803B);color:#2A1408;
  padding:12px 20px;border-radius:999px;font-size:13px;font-weight:700;
  box-shadow:0 10px 26px rgba(0,0,0,0.4);opacity:0;transition:all .35s ease;pointer-events:none;z-index:999;
  max-width:88%;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,4,7,0.72);display:flex;align-items:flex-start;justify-content:center;z-index:900;padding:20px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.modal{width:100%;max-width:380px;margin:auto 0;max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px);overflow-y:auto;-webkit-overflow-scrolling:touch;}

@media (max-width:360px){ .h1{font-size:19px;} }
</style>
</head>

/* ---------- month-search UI helpers (shared by Past Orders / 歷史預約管理 / 歷史訂單管理) ---------- */
function getAvailableMonths(items, dateFn){
  const set = new Set();
  items.forEach(it=>{ const d = dateFn(it); if(d) set.add(d.slice(0,7)); });
  return Array.from(set).sort().reverse();
}
function monthLabel(mk){
  if(!mk) return '';
  const [y,m] = mk.split('-');
  return `${y}年${Number(m)}月`;
}
function renderMonthSearchHeader(prefix, months, selectedMonth){
  if(months.length===0) return `<div class="empty">還沒有資料</div>`;
  const sel = (selectedMonth && months.includes(selectedMonth)) ? selectedMonth : months[0];
  return `
    <div class="row" style="gap:8px;align-items:center;">
      <select class="input col" id="${prefix}-month-select">
        ${months.map(mk=>`<option value="${mk}" ${mk===sel?'selected':''}>${monthLabel(mk)}</option>`).join('')}
      </select>
      <button class="btn btn-solid btn-sm" id="${prefix}-search-btn">搜尋</button>
    </div>`;
}
function renderMonthResultsList(prefix, searchedMonth, resultsSorted, expanded, renderItemFn){
  if(!searchedMonth) return '';
  if(resultsSorted.length===0) return `<div class="empty mt12">${monthLabel(searchedMonth)}無記錄</div>`;
  const shown = expanded ? resultsSorted : resultsSorted.slice(0,6);
  const rows = shown.map(renderItemFn).join('');
  const expandBtn = (!expanded && resultsSorted.length>6)
    ? `<button class="btn btn-ghost btn-sm mt12" id="${prefix}-expand-btn">展開所有記錄（共${resultsSorted.length}筆）</button>`
    : '';
  return `<div class="mt12">${rows}</div>${expandBtn}`;
}

/* ================= data model (multi-table, no whole-blob overwrite) ================= */
let bookings = [];
let orders = [];
let sessions = [];
let vouchers = [];
let settings = { pin:'', name:'寶貝', masseuseName:'你的專屬按摩師', setupDone:false, pricing: clonePricing(DEFAULT_PRICING) };
let ready = false;

function todayStr(){ return toDateStr(new Date()); }
function toDateStr(d){ const y=d.getFullYear(); const m=String(d.getMonth()+1).padStart(2,'0'); const day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function fmtDateNice(str){ if(!str) return '—'; const [y,m,d]=str.split('-').map(Number); return `${m}月${d}日`; }
function fmtMoney(n){ const v = Math.round(n*100)/100; return 'A$'+ (v % 1 === 0 ? v.toFixed(0) : v.toFixed(2).replace(/0$/,'')); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function daysLeft(expiry){ if(!expiry) return 0; const a = new Date(todayStr()); const b = new Date(expiry); return Math.max(0, Math.round((b-a)/86400000)); }
function monthsFromToday(n){ const d = new Date(todayStr()); d.setMonth(d.getMonth()+n); return toDateStr(d); }

/* ---------- low-level REST helpers (each call only ever touches ONE row) ---------- */
async function dbSelect(table){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?select=*`, { headers: SB_HEADERS });
  if(!res.ok) throw new Error(`select ${table} failed: ${res.status}`);
  return res.json();
}
async function dbInsert(table, row){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
    method:'POST',
    headers:{ ...SB_HEADERS, 'Content-Type':'application/json', Prefer:'return=minimal' },
    body: JSON.stringify(row)
  });
  if(!res.ok) throw new Error(`insert ${table} failed: ${res.status}`);
}
async function dbUpdate(table, idField, idValue, patch){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${idField}=eq.${encodeURIComponent(idValue)}`, {
    method:'PATCH',
    headers:{ ...SB_HEADERS, 'Content-Type':'application/json', Prefer:'return=minimal' },
    body: JSON.stringify(patch)
  });
  if(!res.ok) throw new Error(`update ${table} failed: ${res.status}`);
}
async function dbDelete(table, idField, idValue){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${idField}=eq.${encodeURIComponent(idValue)}`, {
    method:'DELETE',
    headers: SB_HEADERS
  });
  if(!res.ok) throw new Error(`delete ${table} failed: ${res.status}`);
}
async function dbUpsertSettings(patch){
  Object.assign(settings, patch);
  const res = await fetch(`${SUPABASE_URL}/rest/v1/app_settings?on_conflict=id`, {
    method:'POST',
    headers:{ ...SB_HEADERS, 'Content-Type':'application/json', Prefer:'resolution=merge-duplicates,return=minimal' },
    body: JSON.stringify({ id:'main', pin:settings.pin, name:settings.name, masseuse_name:settings.masseuseName, setup_done:settings.setupDone, pricing:settings.pricing })
  });
  if(!res.ok) throw new Error('save settings failed: '+res.status);
}

/* row <-> app-shape mappers (DB uses snake_case, app uses camelCase to match existing render code) */
/* addon_hand/addon_foot/voucher_code/use_upgrade_pool are legacy columns kept for old booking records made before the pricing redesign; new bookings use primary_type/addon instead */
function rowToBooking(r){ return { id:r.id, date:r.date, time:r.time, primaryType:r.primary_type||null, addon:r.addon||null, addonHand:r.addon_hand, addonFoot:r.addon_foot, voucherCode:r.voucher_code, useUpgradePool:r.use_upgrade_pool, note:r.note||'', status:r.status, createdAt:r.created_at }; }
function bookingToRow(b){ return { id:b.id, date:b.date, time:b.time, primary_type:b.primaryType||null, addon:b.addon||null, addon_hand:b.addonHand||0, addon_foot:b.addonFoot||0, voucher_code:b.voucherCode||null, use_upgrade_pool:!!b.useUpgradePool, note:b.note||'', status:b.status, created_at:b.createdAt }; }
function rowToOrder(r){ return { id:r.id, items:r.items, total:r.total, status:r.status, createdAt:r.created_at, confirmedAt:r.confirmed_at, cancelledAt:r.cancelled_at }; }
function orderToRow(o){ return { id:o.id, items:o.items, total:o.total, status:o.status, created_at:o.createdAt, confirmed_at:o.confirmedAt||null, cancelled_at:o.cancelledAt||null }; }
function rowToSession(r){ return { id:r.id, bookingId:r.booking_id, date:r.date, time:r.time, service:r.service, source:r.source, price:r.price }; }
function sessionToRow(s){ return { id:s.id, booking_id:s.bookingId, date:s.date, time:s.time, service:s.service, source:s.source, price:s.price }; }
function rowToVoucher(r){ return { code:r.code, orderId:r.order_id, issuedDate:r.issued_date, expiryDate:r.expiry_date, used:r.used, usedDate:r.used_date }; }
function voucherToRow(v){ return { code:v.code, order_id:v.orderId, issued_date:v.issuedDate, expiry_date:v.expiryDate, used:!!v.used, used_date:v.usedDate||null }; }

/* ---------- initial load ---------- */
async function loadState(){
  try{
    const [bRows, oRows, sRows, vRows, setRows] = await Promise.all([
      dbSelect('bookings'), dbSelect('orders'), dbSelect('sessions'), dbSelect('vouchers'), dbSelect('app_settings')
    ]);
    bookings = bRows.map(rowToBooking);
    orders = oRows.map(rowToOrder);
    sessions = sRows.map(rowToSession);
    vouchers = vRows.map(rowToVoucher);
    if(setRows && setRows[0]){
      const dbPricing = setRows[0].pricing || null;
      settings = {
        pin:setRows[0].pin||'', name:setRows[0].name||'寶貝', masseuseName:setRows[0].masseuse_name||'你的專屬按摩師', setupDone:!!setRows[0].setup_done,
        pricing: dbPricing ? {
          monthly: { ...DEFAULT_PRICING.monthly, ...(dbPricing.monthly||{}) },
          addonA: { ...DEFAULT_PRICING.addonA, ...(dbPricing.addonA||{}) },
          addonB: { ...DEFAULT_PRICING.addonB, ...(dbPricing.addonB||{}) }
        } : clonePricing(DEFAULT_PRICING)
      };
    } else {
      settings.pricing = clonePricing(DEFAULT_PRICING);
      await dbUpsertSettings(settings);
    }
    ready = true;
  }catch(e){
    console.error('load error', e);
    showToast('無法連上雲端資料庫，請確認網路或設定');
  }
  ui.screen = settings.setupDone ? 'pin' : 'onboarding';
  render();
}

/* ---------- derived membership (nothing here is ever stored — always recomputed from bookings/orders/sessions/vouchers) ---------- */
function getMembership(){
  const confirmedOrders = orders.filter(o=>o.status==='confirmed');
  const p = settings.pricing;

  // expiryDate: replay confirmed monthly orders in chronological order of confirmation
  const monthlyOrders = confirmedOrders
    .filter(o=>o.items.some(it=>it.key==='monthly'))
    .sort((a,b)=> (a.confirmedAt||'').localeCompare(b.confirmedAt||''));
  let expiryDate = null;
  let memberSince = null;
  const cycleDays = p.monthly.days || 30;
  monthlyOrders.forEach(o=>{
    if(!memberSince) memberSince = o.confirmedAt;
    const qty = o.items.find(it=>it.key==='monthly').qty;
    for(let i=0;i<qty;i++){
      const anchor = (expiryDate && new Date(expiryDate) >= new Date(o.confirmedAt)) ? new Date(expiryDate) : new Date(o.confirmedAt);
      anchor.setDate(anchor.getDate()+cycleDays);
      expiryDate = toDateStr(anchor);
    }
  });
  const active = confirmedOrders.length>0;
  const planType = monthlyOrders.length>0 ? 'monthly' : null;

  // basicRemaining / luxuryRemaining: two independent pools granted by monthly orders, each minus its own consumed sessions
  const monthlyQtyTotal = monthlyOrders.reduce((s,o)=> s + o.items.find(it=>it.key==='monthly').qty, 0);
  const basicGranted = monthlyQtyTotal * (p.monthly.basicCount||0);
  // count both new-format sessions (service:'basic', source:'月訂閱涵蓋・基礎') and legacy ones from
  // before the pricing redesign (service:'full', source:'月訂閱涵蓋') — otherwise old consumption becomes invisible
  const basicUsed = sessions.filter(s=> (s.service==='basic' && s.source==='月訂閱涵蓋・基礎') || (s.service==='full' && s.source==='月訂閱涵蓋')).length;
  const basicRemaining = Math.max(0, basicGranted - basicUsed);

  const luxuryGranted = monthlyQtyTotal * (p.monthly.luxuryCount||0);
  const luxuryUsed = sessions.filter(s=>s.service==='luxury' && s.source==='月訂閱涵蓋・頂奢').length;
  const luxuryRemaining = Math.max(0, luxuryGranted - luxuryUsed);

  // addonACredits / addonBCredits: granted (single-purchase items) minus consumed (upsize sessions paid from this pool)
  function singleCredit(key, source){
    const granted = confirmedOrders.reduce((s,o)=>{
      const it = o.items.find(i=>i.key===key);
      return s + (it ? it.qty : 0);
    }, 0);
    const used = sessions.filter(s=>s.service===key && s.source===source).length;
    return Math.max(0, granted - used);
  }
  const addonACredits = singleCredit('addonA','加購・豪華升級');
  const addonBCredits = singleCredit('addonB','加購・頂奢升級');

  return { active, planType, memberSince, expiryDate, basicRemaining, luxuryRemaining, addonACredits, addonBCredits };
}
function isMonthlyActive(){ const m = getMembership(); return m.planType==='monthly' && m.expiryDate && new Date(m.expiryDate) >= new Date(todayStr()); }
function basicBookable(){ const m = getMembership(); return isMonthlyActive() && (m.basicRemaining||0) > 0; }
function luxuryBookable(){ const m = getMembership(); return isMonthlyActive() && (m.luxuryRemaining||0) > 0; }
function hasAnyBookableItem(){ return basicBookable() || luxuryBookable(); }

  if(b.voucherCode) return '雙手雙脚全套升級（禮券 '+b.voucherCode+'）';

function determineSource(type){
  const m = getMembership();
  const p = settings.pricing;
  if(type==='basic'){
    if(isMonthlyActive() && m.basicRemaining>0) return {source:'月訂閱涵蓋・基礎', price:0};
    return {source:'現場加算', price:p.monthly.price};
  }
  if(type==='luxury'){
    if(isMonthlyActive() && m.luxuryRemaining>0) return {source:'月訂閱涵蓋・頂奢', price:0};
    return {source:'現場加算', price:p.monthly.price};
  }
  if(type==='addonA'){
    if(m.addonACredits>0) return {source:'加購・豪華升級', price:0};
    return {source:'現場加算', price:p.addonA.price};
  }
  if(type==='addonB'){
    if(m.addonBCredits>0) return {source:'加購・頂奢升級', price:0};
    return {source:'現場加算', price:p.addonB.price};
  }
}
async function performBookingService(b){
  const newSessions = [];
  if(b.primaryType==='luxury'){
    const r = determineSource('luxury');
    newSessions.push({ id:uid(), bookingId:b.id, date:b.date, time:b.time, service:'luxury', source:r.source, price:r.price });
  } else {
    // basic (also the fallback for legacy bookings that predate primaryType)
    const r = determineSource('basic');
    newSessions.push({ id:uid(), bookingId:b.id, date:b.date, time:b.time, service:'basic', source:r.source, price:r.price });
    if(b.addon==='A'){ const ra = determineSource('addonA'); newSessions.push({ id:uid(), bookingId:b.id, date:b.date, time:b.time, service:'addonA', source:ra.source, price:ra.price }); }
    if(b.addon==='B'){ const rb = determineSource('addonB'); newSessions.push({ id:uid(), bookingId:b.id, date:b.date, time:b.time, service:'addonB', source:rb.source, price:rb.price }); }
  }
  sessions.unshift(...newSessions);
  try{ await Promise.all(newSessions.map(s=>dbInsert('sessions', sessionToRow(s)))); }catch(e){ console.error(e); showToast('儲存失敗，請確認網路連線'); }
}
async function reverseBookingService(b){
  const linked = sessions.filter(s=>s.bookingId===b.id);
  sessions = sessions.filter(s=>s.bookingId!==b.id);
  try{ await Promise.all(linked.map(s=>dbDelete('sessions','id', s.id))); }catch(e){ console.error(e); }
}
async function completeBooking(id){
  const b = bookings.find(x=>x.id===id); if(!b) return;
  await performBookingService(b);
  b.status='completed';
  try{ await dbUpdate('bookings','id', id, {status:'completed'}); }catch(e){ console.error(e); showToast('更新失敗'); }
  render();
  showToast('已完成，並記錄這次儀式 🕯');
}
async function deleteBooking(id){
  const b = bookings.find(x=>x.id===id); if(!b) return;
  if(b.status==='completed') await reverseBookingService(b);
  bookings = bookings.filter(x=>x.id!==id);
  try{ await dbDelete('bookings','id', id); }catch(e){ console.error(e); showToast('刪除失敗，請確認網路連線'); }

}
async function saveBookingEdit(id, draft){
  const b = bookings.find(x=>x.id===id); if(!b) return;
  const wasCompleted = b.status==='completed';
  const willBeCompleted = draft.status==='completed';
  if(wasCompleted) await reverseBookingService(b);
  b.date = draft.date; b.time = draft.time; b.note = draft.note; b.status = draft.status;
  b.primaryType = draft.primaryType; b.addon = draft.addon;
  b.addonHand = 0; b.addonFoot = 0; b.voucherCode = null; b.useUpgradePool = false;
  if(willBeCompleted) await performBookingService(b);
  try{ await dbUpdate('bookings','id', id, bookingToRow(b)); }catch(e){ console.error(e); showToast('更新失敗'); }
  render();
  showToast('預約紀錄已更新，會員資料已同步');
}

        <div class="row" style="justify-content:space-between;padding:0 2px;"><b>合計</b><b class="num" style="color:var(--gold-soft);font-size:18px;">${fmtMoney(total)}</b></div>
        <div class="row mt20">
          <button class="btn btn-ghost col" id="eo-cancel">取消</button>
          <button class="btn btn-solid col" id="eo-save">儲存修改</button>
        </div>
        <button class="btn btn-danger mt12" id="eo-delete" style="width:100%;">刪除此筆訂單</button>
      </div>`;
    bg.querySelectorAll('[data-eo-status]').forEach(el=> el.onclick = ()=>{ draft.status = el.getAttribute('data-eo-status'); draw(); });
    bg.querySelectorAll('[data-eo-minus]').forEach(el=>{ el.onclick = ()=>{ const k=el.getAttribute('data-eo-minus'); qtyMap[k]=Math.max(0,(qtyMap[k]||0)-1); draw(); }; });
    bg.querySelectorAll('[data-eo-plus]').forEach(el=>{ el.onclick = ()=>{ const k=el.getAttribute('data-eo-plus'); qtyMap[k]=(qtyMap[k]||0)+1; draw(); }; });
    bg.querySelector('#eo-cancel').onclick = ()=> bg.remove();
    bg.querySelector('#eo-save').onclick = ()=>{ saveOrderEdit(order, qtyMap, draft.status); bg.remove(); };
    bg.querySelector('#eo-delete').onclick = ()=>{
      openConfirmModal('確定要刪除這筆訂單嗎？此操作無法復原。', ()=>{ deleteOrder(order.id); bg.remove(); });
    };
  }
  draw();
  document.body.appendChild(bg);
}
async function saveOrderEdit(order, qtyMap, newStatus){
  const oldStatus = order.status;
  newStatus = newStatus || oldStatus;
  if(oldStatus==='confirmed' && newStatus!=='confirmed'){
    await reverseOrderEffects(order);
    order.confirmedAt = null;
  }
  order.items.forEach(it=> it.qty = qtyMap[it.key]||0);
  order.items = order.items.filter(it=>it.qty>0);
  order.total = order.items.reduce((s,it)=> s + it.price*it.qty, 0);
  if(oldStatus!=='confirmed' && newStatus==='confirmed'){
    order.confirmedAt = todayStr();
    await applyOrderEffects(order);
  }
  if(newStatus==='cancelled'){ order.cancelledAt = todayStr(); }
  if(newStatus==='pending'){ order.cancelledAt = null; }
  order.status = newStatus;
  try{ await dbUpdate('orders','id', order.id, orderToRow(order)); }catch(e){ console.error(e); showToast('更新失敗'); }
  render();
  showToast('訂單已更新，會員資料已同步');
}

function renderBookingCalendar(){
  const [cy, cm] = ui.calendarMonth.split('-').map(Number);
  const firstDay = new Date(cy, cm-1, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(cy, cm, 0).getDate();
  const today = todayStr();
  const dotColor = { pending:'#E7CB8E', confirmed:'#D98A93', completed:'#8FAE86', declined:'#C06A5F' };
  const svcBadge = {pending:['待確認','badge-pending'],confirmed:['已確認','badge-confirmed'],completed:['已完成','badge-completed'],declined:['已取消','badge-declined']};

  const byDate = {};
  bookings.forEach(b=>{ (byDate[b.date] = byDate[b.date]||[]).push(b); });

  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += `<div class="cal-day empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${cy}-${String(cm).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayBookings = byDate[dateStr] || [];
    let dotHTML = '';
    if(dayBookings.length>0){
      let color;
      if(dayBookings.some(b=>b.status==='completed')) color = dotColor.completed;
      else if(dayBookings.some(b=>b.status==='confirmed')) color = dotColor.confirmed;
      else if(dayBookings.some(b=>b.status==='pending')) color = dotColor.pending;
      else color = dotColor.declined;
      dotHTML = `<div class="cal-dot" style="background:${color};"></div>`;
    }
    cells += `<div class="cal-day ${dateStr===today?'today':''} ${ui.calendarSelectedDate===dateStr?'selected':''}" data-cal-day="${dateStr}">${d}${dotHTML}</div>`;
  }

  const selected = ui.calendarSelectedDate ? (byDate[ui.calendarSelectedDate]||[]) : [];
  return `
    <div class="cal-wrap">
      <div class="cal-header">
        <button class="cal-nav" data-cal-nav="-1">‹</button>
        <div class="cal-title">${cy}年${cm}月</div>
        <button class="cal-nav" data-cal-nav="1">›</button>

      <div class="cal-grid">
        ${['日','一','二','三','四','五','六'].map(w=>`<div class="cal-weekday">${w}</div>`).join('')}

      <div class="cal-legend">
        <span><span class="cal-dot" style="background:${dotColor.pending};"></span>待確認</span>
        <span><span class="cal-dot" style="background:${dotColor.confirmed};"></span>已確認</span>
        <span><span class="cal-dot" style="background:${dotColor.declined};"></span>已取消</span>
        <span><span class="cal-dot" style="background:${dotColor.completed};"></span>已完成</span>
      </div>
      ${ui.calendarSelectedDate ? `
        <div class="divider"></div>
        <div class="eyebrow" style="text-align:left;">${fmtDateNice(ui.calendarSelectedDate)}</div>
        ${selected.length===0 ? `<div class="empty">這天沒有預約紀錄</div>` : selected.map(b=>`
          <div class="list-item">
            <div class="row" style="justify-content:space-between;align-items:center;">
              <div><b>${b.time}</b></div>
              <span class="badge ${svcBadge[b.status][1]}">${svcBadge[b.status][0]}</span>
            </div>

function renderFuturePastSections(){

  const future = bookings
    .filter(b=> (b.status==='pending'||b.status==='confirmed') && b.date>=today && b.date<=futureCutoff)
    .sort((a,b)=> a.date===b.date ? a.time.localeCompare(b.time) : a.date.localeCompare(b.date));

  const rowHTML = (b)=>`
    <div class="list-item">
      <div class="row" style="justify-content:space-between;align-items:center;">
        <div><b>${fmtDateNice(b.date)} ${b.time}</b></div>

  const orderBadge = {confirmed:['已確認','badge-confirmed'],cancelled:['已取消','badge-declined']};
  const pastOrders = orders.filter(o=> o.status==='confirmed' || o.status==='cancelled');
  const poDateFn = (o)=> o.confirmedAt || o.cancelledAt || null;
  const poMonths = getAvailableMonths(pastOrders, poDateFn);
  const poSearched = ui.pastOrdersSearchedMonth;
  const poResults = poSearched ? pastOrders
    .filter(o=> (poDateFn(o)||'').slice(0,7)===poSearched)
    .sort((a,b)=>{
      const da = a.confirmedAt||a.cancelledAt||''; const db = b.confirmedAt||b.cancelledAt||'';
      return db.localeCompare(da) || b.createdAt-a.createdAt;
    }) : [];
  const poRow = (o)=>`
    <div class="list-item">
      <div class="row" style="justify-content:space-between;align-items:center;">
        <div><b>${fmtDateNice(o.confirmedAt||o.cancelledAt||todayStr())}</b></div>

      </div>
      <div style="font-size:12px;color:var(--muted);margin-top:5px;">${o.items.map(it=>`${it.label}×${it.qty}`).join('、')}</div>
      <div class="num" style="color:var(--gold-soft);margin-top:4px;font-size:15px;">${fmtMoney(o.total)}</div>
    </div>`;

  return `
    ${hasAnyBookableItem() ? `<button class="btn btn-solid mt16" id="book-now-btn"><span class="icon-symbol" style="color:#1D0F17;">calendar_add_on</span>立即預約</button>` : ''}
    <div class="divider"></div>
    <div class="eyebrow" style="text-align:left;">Future Bookings</div>
    ${future.length===0 ? `<div class="empty">近兩個月內沒有即將到來的預約</div>` : future.map(rowHTML).join('')}
    <div class="divider"></div>
    <div class="eyebrow" style="text-align:left;">Past History</div>
    ${renderBookingCalendar()}
    <button class="btn btn-ghost mt16" id="export-excel"><span class="icon-symbol" style="color:#F3F3F3;">csv</span>匯出所有歷史紀錄（Excel）</button>
    <div class="divider"></div>
    <div class="eyebrow" style="text-align:left;">Past Orders</div>
    ${renderMonthSearchHeader('po', poMonths, ui.pastOrdersMonth)}
    ${renderMonthResultsList('po', poSearched, poResults, ui.pastOrdersExpanded, poRow)}
  `;
}

  const wb = XLSX.utils.book_new();
  if(bookingRows.length>0) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(bookingRows), '預約管理');
  if(orderRows.length>0) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(orderRows), '歷史訂單');
  XLSX.writeFile(wb, `Giraffe-Care-Club-管理紀錄-${todayStr()}.xlsx`);
}

function renderOverviewTab(){
  const p = settings.pricing;
  const thisMonth = todayStr().slice(0,7);
  // 'full' is the legacy service name used before the pricing redesign — still counted here so old sessions from this month aren't dropped from the stats
  const monthSessions = sessions.filter(s=> s.date.startsWith(thisMonth) && (s.service==='basic' || s.service==='luxury' || s.service==='full'));
  const totalMinutes = sessions
    .filter(s=> s.date.startsWith(thisMonth))
    .reduce((sum,s)=>{
      if(s.service==='basic' || s.service==='full') return sum + p.monthly.basicDuration;
      if(s.service==='luxury') return sum + p.monthly.luxuryDuration;
      if(s.service==='addonA') return sum + Math.max(0, p.addonA.totalDuration - p.monthly.basicDuration);
      if(s.service==='addonB') return sum + Math.max(0, p.addonB.totalDuration - p.monthly.basicDuration);
      // legacy service names from before the pricing redesign — their durations were fixed, not editable, so hardcode them here
      if(s.service==='upgrade') return sum + 8;
      if(s.service==='hand') return sum + 2;
      if(s.service==='foot') return sum + 2;
      return sum;
    }, 0);
  const totalRevenue = orders.filter(o=>o.status==='confirmed' && o.confirmedAt && o.confirmedAt.startsWith(thisMonth)).reduce((s,o)=>s+o.total,0);
  return `
    <div class="mcard-wrap">
      <img class="mcard-img" src="${STAFF_CARD_IMG}" alt="Giraffe Care Club 員工證">
    </div>
    <div class="quota-row">
      <div class="quota-pill"><div class="n num">${monthSessions.length}</div><div class="l">本月按摩次數</div></div>
      <div class="quota-pill"><div class="n num">${totalMinutes}</div><div class="l">本月總分鐘</div></div>
      <div class="quota-pill"><div class="n num">${fmtMoney(totalRevenue)}</div><div class="l">本月營收</div></div>
    </div>
    <button class="btn btn-ghost mt16" id="open-pricing-btn"><span class="icon-symbol" style="color:#F3F3F3;">edit</span>價目表設定</button>
  `;
}

  const draft = clonePricing(settings.pricing);
  const bg = document.createElement('div');
  bg.className='modal-bg';
  function draw(){
    bg.innerHTML = `
      <div class="modal card-panel">
        <div class="h1" style="font-size:17px;">價目表設定</div>
        <div style="font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.6;">修改會立即生效。已購買的訂單金額與已完成的預約紀錄不會被改變；但目前生效中的月訂閱剩餘次數／到期天數是即時計算，調整次數或天數會直接套用到目前的訂閱。</div>

        <div class="eyebrow" style="text-align:left;margin-top:16px;">月訂閱</div>
        <label class="label mt8">名稱</label>
        <input class="input" id="pm-monthly-label" value="${draft.monthly.label}">
        <div class="row mt8" style="gap:10px;">
          <div class="col"><label class="label">價格（元）</label><input class="input" type="number" step="0.5" id="pm-monthly-price" value="${draft.monthly.price}"></div>
          <div class="col"><label class="label">有效天數</label><input class="input" type="number" id="pm-monthly-days" value="${draft.monthly.days}"></div>
        </div>
        <label class="label mt8">基礎項目名稱</label>
        <input class="input" id="pm-basic-label" value="${draft.monthly.basicLabel}">
        <div class="row mt8" style="gap:10px;">
          <div class="col"><label class="label">基礎次數</label><input class="input" type="number" id="pm-basic-count" value="${draft.monthly.basicCount}"></div>
          <div class="col"><label class="label">基礎時長（分鐘）</label><input class="input" type="number" id="pm-basic-duration" value="${draft.monthly.basicDuration}"></div>
        </div>
        <label class="label mt8">頂奢項目名稱</label>
        <input class="input" id="pm-luxury-label" value="${draft.monthly.luxuryLabel}">
        <div class="row mt8" style="gap:10px;">
          <div class="col"><label class="label">頂奢次數</label><input class="input" type="number" id="pm-luxury-count" value="${draft.monthly.luxuryCount}"></div>
          <div class="col"><label class="label">頂奢時長（分鐘）</label><input class="input" type="number" id="pm-luxury-duration" value="${draft.monthly.luxuryDuration}"></div>
        </div>

        <div class="divider"></div>
        <div class="eyebrow" style="text-align:left;">加購項目 A</div>
        <label class="label mt8">名稱</label>
        <input class="input" id="pm-a-label" value="${draft.addonA.label}">
        <div class="row mt8" style="gap:10px;">
          <div class="col"><label class="label">升級後總時長（分鐘）</label><input class="input" type="number" id="pm-a-total" value="${draft.addonA.totalDuration}"></div>
          <div class="col"><label class="label">價格（元）</label><input class="input" type="number" step="0.5" id="pm-a-price" value="${draft.addonA.price}"></div>
        </div>

        <div class="divider"></div>
        <div class="eyebrow" style="text-align:left;">加購項目 B</div>
        <label class="label mt8">名稱</label>
        <input class="input" id="pm-b-label" value="${draft.addonB.label}">
        <div class="row mt8" style="gap:10px;">
          <div class="col"><label class="label">升級後總時長（分鐘）</label><input class="input" type="number" id="pm-b-total" value="${draft.addonB.totalDuration}"></div>
          <div class="col"><label class="label">價格（元）</label><input class="input" type="number" step="0.5" id="pm-b-price" value="${draft.addonB.price}"></div>
        </div>

        <div class="row mt20">
          <button class="btn btn-ghost col" id="pm-cancel">取消</button>
          <button class="btn btn-solid col" id="pm-save">儲存</button>
        </div>
      </div>`;
    bg.querySelector('#pm-cancel').onclick = ()=> bg.remove();
    bg.querySelector('#pm-save').onclick = ()=>{
      const num = (id, fallback)=>{ const v = parseFloat(bg.querySelector(id).value); return isFinite(v) ? v : fallback; };
      const str = (id, fallback)=>{ const v = bg.querySelector(id).value.trim(); return v || fallback; };
      const newPricing = {
        monthly: {
          label: str('#pm-monthly-label', draft.monthly.label),
          price: num('#pm-monthly-price', draft.monthly.price),
          days: Math.max(1, Math.round(num('#pm-monthly-days', draft.monthly.days))),
          basicLabel: str('#pm-basic-label', draft.monthly.basicLabel),
          basicCount: Math.max(0, Math.round(num('#pm-basic-count', draft.monthly.basicCount))),
          basicDuration: Math.max(1, Math.round(num('#pm-basic-duration', draft.monthly.basicDuration))),
          luxuryLabel: str('#pm-luxury-label', draft.monthly.luxuryLabel),
          luxuryCount: Math.max(0, Math.round(num('#pm-luxury-count', draft.monthly.luxuryCount))),
          luxuryDuration: Math.max(1, Math.round(num('#pm-luxury-duration', draft.monthly.luxuryDuration)))
        },
        addonA: {
          label: str('#pm-a-label', draft.addonA.label),
          totalDuration: Math.max(1, Math.round(num('#pm-a-total', draft.addonA.totalDuration))),
          price: num('#pm-a-price', draft.addonA.price)
        },
        addonB: {
          label: str('#pm-b-label', draft.addonB.label),
          totalDuration: Math.max(1, Math.round(num('#pm-b-total', draft.addonB.totalDuration))),
          price: num('#pm-b-price', draft.addonB.price)
        }
      };
      dbUpsertSettings({ pricing: newPricing });
      bg.remove(); render();
      showToast('價目表已更新');
    };
  }
  draw();
  document.body.appendChild(bg);
}

/* ================= init ================= */
loadState();
</script>
</body>
</html>
